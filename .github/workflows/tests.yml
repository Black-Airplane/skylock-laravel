name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        exclude:
          - php: '8.2'
            laravel: '13'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install Laravel ${{ matrix.laravel }}
        run: |
          composer require "illuminate/console:^${{ matrix.laravel }}.0" "illuminate/http:^${{ matrix.laravel }}.0" "illuminate/support:^${{ matrix.laravel }}.0" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Test
        run: vendor/bin/pest

  quality:
    name: Style and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  real-server:
    # The security count and version order, held against apt itself on a real Ubuntu (tests/RealServerTest.php).
    name: Against apt, Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress

      - name: Fresh lists, kept as a server keeps them
        run: |
          sudo rm -f /etc/apt/apt.conf.d/*gzip-indexes*
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-apt
          ls -l /var/lib/apt/lists | grep -- '-security_'

      - name: Test
        run: vendor/bin/pest tests/RealServerTest.php
        env:
          SKYLOCK_REAL_SERVER: '1'
